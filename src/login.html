<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>jrz's Soundpack Tool</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">jrz's</div>
      <div class="subtitle">Soundpack Tool</div>

      <label class="field-label">LICENSE KEY</label>
      <input id="key" type="text" placeholder="XXXX-XXXX-XXXX-XXXX" autofocus />

      <div class="remember">
        <input id="remember" type="checkbox" checked />
        <label for="remember">Remember me</label>
      </div>

      <button id="signin" class="btn-primary">Sign In</button>
      <div id="error" class="error-msg"></div>

      <div style="margin-top:18px;border-top:1px solid var(--border);padding-top:14px">
        <a id="genLink" href="#" style="font-size:11.5px;color:var(--muted)">+ Generate a new key (owner only)</a>
        <div id="genPanel" style="display:none;margin-top:10px;text-align:left">
          <input id="genOwner" type="text" placeholder="Who's this key for?" />
          <button id="genBtn" class="btn-primary" style="margin-top:8px">Generate</button>
          <div id="genResult" style="margin-top:10px;font-size:12.5px"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
